    body { padding-top: 0; }

    .lt-wrap {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 40px;
    }

    .lt-logo { width: 220px; height: auto; margin-bottom: 8px; }
    .lt-tagline {
      color: var(--clr-text-muted);
      font-size: 13px;
      letter-spacing: .3px;
      margin-bottom: 32px;
    }

    .lt-links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .lt-link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      text-decoration: none;
      color: var(--clr-text);
      font-size: 15px;
      font-weight: 600;
      transition: var(--transition);
    }
    .lt-link:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--clr-accent);
    }

    .lt-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
    }
    .lt-icon svg { width: 20px; height: 20px; }

    .lt-footer {
      margin-top: 40px;
      font-size: 12px;
      color: var(--clr-text-muted);
      text-align: center;
    }
  </style>
</head>
